<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BetPredict Pro AI</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="./manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="./assets/icons/icon-96.png" />

    <!-- Apple PWA -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BetPredict" />

    <!-- Theme -->
    <meta name="theme-color" content="#0a1428" />
    <meta name="mobile-web-app-capable" content="yes" />

    <script type="module" crossorigin src="./assets/index-BLN-bWj2.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CAraPIJm.css">

    <style>
      :root {
        --ff-display: 'Inter', system-ui, sans-serif;
        --ff-body: 'Inter', system-ui, sans-serif;
      }

      #bp-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 30%, #0d1d3a 0%, #040912 55%, #02050c 100%);
        transition: opacity .55s ease, visibility .55s;
        will-change: opacity;
      }

      #bp-splash.bp-splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .bp-splash-inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .bp-splash-halo {
        position: absolute;
        inset: -80px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(74,177,255,.30) 0%, rgba(0,255,156,.18) 35%, transparent 70%);
        filter: blur(40px);
        animation: bp-splash-pulse 2.4s ease-in-out infinite;
        pointer-events: none;
      }

      .bp-splash-logo {
        width: 200px;
        height: 200px;
        border-radius: 46px;
        box-shadow: 0 0 80px rgba(74,177,255,.35), 0 24px 60px rgba(0,0,0,.55);
        animation: bp-splash-rise .8s cubic-bezier(.2,.7,.2,1) both;
        position: relative;
        z-index: 1;
      }

      .bp-splash-name {
        font-family: var(--ff-display);
        font-weight: 800;
        font-size: 28px;
        letter-spacing: -.01em;
        background: linear-gradient(90deg, #00ff9c, #4ab1ff, #b693ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: bp-splash-fadeup .9s ease-out .15s both;
        white-space: nowrap;
        max-width: 92vw;
        text-align: center;
      }

      .bp-splash-name span {
        margin-left: 8px;
        color: #fbbf24;
        -webkit-text-fill-color: #fbbf24;
        font-size: 14px;
        letter-spacing: .18em;
        vertical-align: 2px;
        font-weight: 700;
      }

      .bp-splash-tag {
        font-family: var(--ff-body);
        font-size: 10px;
        letter-spacing: .32em;
        color: #94a3b8;
        text-transform: uppercase;
        font-weight: 600;
        animation: bp-splash-fadeup .9s ease-out .3s both;
        white-space: nowrap;
      }

      .bp-splash-bar {
        width: 160px;
        height: 3px;
        border-radius: 99px;
        background: rgba(255,255,255,.08);
        overflow: hidden;
        margin-top: 6px;
        animation: bp-splash-fadeup .9s ease-out .45s both;
      }

      .bp-splash-bar i {
        display: block;
        height: 100%;
        width: 35%;
        border-radius: 99px;
        background: linear-gradient(90deg, #00ff9c, #4ab1ff, #b693ff);
        animation: bp-splash-slide 1.4s ease-in-out infinite;
      }

      @keyframes bp-splash-pulse {
        0%, 100% { transform: scale(1); opacity: .85; }
        50%       { transform: scale(1.08); opacity: 1; }
      }
      @keyframes bp-splash-rise {
        from { opacity: 0; transform: translateY(20px) scale(.92); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes bp-splash-fadeup {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes bp-splash-slide {
        0%   { transform: translateX(-110%); }
        100% { transform: translateX(310%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .bp-splash-logo, .bp-splash-name, .bp-splash-tag,
        .bp-splash-bar, .bp-splash-halo, .bp-splash-bar i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>

    <!-- Splash screen -->
    <div id="bp-splash" aria-hidden="true">
      <div class="bp-splash-inner">
        <div class="bp-splash-halo"></div>
        <img class="bp-splash-logo" src="./assets/icons/icon-512.png" alt="BetPredict" width="200" height="200" decoding="async" fetchpriority="high" />
        <div class="bp-splash-name">BETPREDICT<span>PRO</span></div>
        <div class="bp-splash-tag">Sports Analytics AI</div>
        <div class="bp-splash-bar"><i></i></div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      (function () {
        function hide() {
          var s = document.getElementById('bp-splash');
          if (s) s.classList.add('bp-splash-hidden');
          setTimeout(function () {
            if (s && s.parentNode) s.parentNode.removeChild(s);
          }, 700);
        }

        var SPLASH_KEY = 'bp_splash_seen';
        var alreadySeen = false;
        try { alreadySeen = !!sessionStorage.getItem(SPLASH_KEY); } catch (e) {}

        if (alreadySeen) {
          var s = document.getElementById('bp-splash');
          if (s && s.parentNode) s.parentNode.removeChild(s);
        } else {
          try { sessionStorage.setItem(SPLASH_KEY, '1'); } catch (e) {}
          var t0 = Date.now();
          function ready() {
            var elapsed = Date.now() - t0;
            setTimeout(hide, Math.max(0, 2200 - elapsed));
          }
          if (document.readyState === 'complete') ready();
          else window.addEventListener('load', ready, { once: true });
          setTimeout(hide, 4000);
        }
      })();
    </script>
  </body>
</html>
