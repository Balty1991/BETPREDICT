name: 🔴 Fetch Live Scores

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: betpredict-push
  cancel-in-progress: false

jobs:
  fetch-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Fetch live
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: python src/fetch_live.py

      - name: Commit & Push
        run: |
          git config --local user.email "betpredict-bot@github.com"
          git config --local user.name  "BetPredict Bot"
          git add data/live.json data/live_window.json data/live_intelligence.json data/live_state_cache.json data/debug/live_debug.json data/debug/live_intelligence_debug.json -f
          git diff --quiet && git diff --staged --quiet && exit 0
          git commit -m "🔴 live intelligence $(date -u '+%H:%M UTC')"
          git fetch origin main
          git rebase origin/main
          git push
