name: 🧠 Local Predictions + Claude Ticket Review

on:
  schedule:
    # 1x/zi, dimineața devreme (04:10 UTC = ~07:10 ora României vara / 06:10 iarna),
    # după predict_historical.yml (03:50 UTC), ca predicțiile locale să fie proaspete.
    # Predicțiile per meci vin gratuit din modelul local (ml_ensemble antrenat pe
    # istoric) — Claude intervine o singură dată, ieftin, doar ca să revizuiască
    # biletele de acumulator deja construite (vezi call_claude_review în
    # claude_analysis.py), nu meciurile individuale.
    - cron: '10 4 * * *'
  workflow_dispatch:

concurrency:
  group: betpredict-claude-analysis
  cancel-in-progress: false

jobs:
  claude-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-claude-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-claude-

      - name: Install deps
        run: pip install anthropic>=0.69.0

      - name: Predicții locale + revizuire bilete Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: time python src/claude_analysis.py

      - name: Commit & Push
        run: |
          git config --local user.email "betpredict-bot@github.com"
          git config --local user.name  "BetPredict Bot"
          git add data/claude_predictions.json data/claude_accumulators.json \
            src/claude_analysis.py requirements.txt \
            .github/workflows/claude_analysis.yml -f
          git diff --quiet && git diff --staged --quiet && exit 0
          git commit -m "🧠 Predicții locale + revizuire bilete $(TZ=Europe/Bucharest date '+%d.%m %H:%M')"
          for i in 1 2 3; do
            git fetch origin main && git rebase --autostash origin/main && git push && break || {
              echo "Push retry $i/3..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            }
          done
