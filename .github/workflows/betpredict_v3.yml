name: 🤖 BetPredict v3 (pipeline + deploy gh-pages)

# Pipeline-ul nou: BSD (plan Unlimited) → SQLite → robot → bilete/piramidă/statistici → api/*.json → gh-pages.
# Baza de date NU se comite în git: trăiește ca asset în release-ul `betpredict-db`
# (data.db.gz + site_api.tar.gz), suprascris la fiecare rulare.
# Rulează programat doar de pe main (GitHub execută cron-urile numai pe branch-ul implicit).

on:
  schedule:
    # Ore în UTC. Publicarea biletelor e de 4 ori pe zi, ora României (Europe/Bucharest).
    - cron: '0 3 * * *'          # daily 06:00 RO (vara); lanțul din betpredict_slot.yml ține ora și iarna
    - cron: '41 7-20 * * *'      # closing 10:41–23:41 RO: linia de închidere + „Valoare în ultimele 3 ore” (deploy doar la alertă nouă)
    - cron: '29 15-19 * * *'     # closing extra 18:29–22:29 RO (deploy doar la alertă nouă)
    - cron: '47 2 * * 1'         # learn: re-antrenare săptămânală (luni 05:47 RO)
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily | refresh | closing | learn | offline'
        required: true
        default: refresh
        type: choice
        options: [daily, refresh, closing, learn, offline]
      rebuild_tickets:
        description: 'Regenerează biletele zilei (cele vechi devin "replaced")'
        type: boolean
        default: false

# O singură rulare odată (aceeași bază de date din release): următoarea așteaptă la coadă, nu o anulează pe cea curentă.
# GitHub păstrează cel mult o rulare în așteptare per grup (una mai nouă o înlocuiește pe cea veche) — ok, datele sunt cumulative.
concurrency:
  group: betpredict-v3-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: read   # issue-urile „Bilet Ștefan” (linkuri trimise din aplicație)

env:
  BSD_PLAN: unlimited   # Football API Unlimited (founder, 11.10.2026): fără cotă zilnică, /odds/comparison, Pinnacle
  BSD_DAILY_QUOTA: '0'
  BETPREDICT_QUOTA_RESERVE: '300'   # pipeline-urile vechi live/daily sunt oprite; rezervă mică
  BETPREDICT_STATE_DIR: .betpredict

jobs:
  once:
    runs-on: ubuntu-24.04   # fixat: ubuntu-latest trece pe Ubuntu 26 din 19.10.2026
    timeout-minutes: 3
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - name: O singură publicare pe slot
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "go=1" >> "$GITHUB_OUTPUT"
          MODE="${{ github.event.inputs.mode }}"
          SCHED="${{ github.event.schedule }}"
          if [ "${{ github.event.inputs.rebuild_tickets }}" = "true" ]; then exit 0; fi
          # pornită de mână (nu de slot/watchdog): rulează mereu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.actor }}" != "github-actions[bot]" ]; then exit 0; fi
          case "$MODE$SCHED" in
            closing*|learn*|offline*|*41\ 7-20*|*29\ 15-19*|*47\ 2\ *) exit 0 ;;
          esac
          gen=$(curl -fsSL --max-time 20 "https://balty1991.github.io/BETPREDICT/api/meta.json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("generated_at") or "")' || true)
          age=9999
          if [ -n "$gen" ]; then age=$(( ( $(date -u +%s) - $(date -u -d "$gen" +%s) ) / 60 )); fi
          echo "Vechime publicare: $age min"
          if [ "$age" -lt 25 ]; then
            echo "go=0" >> "$GITHUB_OUTPUT"
            echo "Publicat acum $age min. Nu mai schimb biletele."
          fi

  pipeline:
    needs: once
    if: needs.once.outputs.go == '1'
    runs-on: ubuntu-24.04   # fixat: ubuntu-latest trece pe Ubuntu 26 din 19.10.2026
    timeout-minutes: ${{ (github.event.schedule == '47 2 * * 1' || github.event.inputs.mode == 'learn') && 110 || 45 }}   # learn (re-antrenare v4) poate depăși 60 min; restul 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v3.txt

      - name: Install
        run: pip install -r requirements-v3.txt

      - name: Mod + plafon cereri
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              '0 3 * * *') MODE=daily ;;
              '47 2 * * 1') MODE=learn ;;
              '41 7-20 * * *'|'29 15-19 * * *') MODE=closing ;;
              *) MODE=refresh ;;
            esac
          fi
          # Closing publică site-ul doar la o alertă nouă „Valoare în ultimele 3 ore”. Și dacă s-a sărit un slot întreg (peste 7 ore) publică datele.
          if [ "$MODE" = "closing" ]; then
            gen=$(curl -fsSL --max-time 20 "https://balty1991.github.io/BETPREDICT/api/meta.json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("generated_at") or "")' || true)
            age=9999
            if [ -n "$gen" ]; then
              age=$(( ( $(date -u +%s) - $(date -u -d "$gen" +%s) ) / 60 ))
            fi
            echo "Site public: ${gen:-lipsește}, vechime ${age} min"
            if [ "$age" -ge 420 ]; then
              MODE=refresh
              echo "Peste 7 ore fără publicare — closing devine refresh."
            fi
          fi
          case "$MODE" in
            daily) CAP=6000 ;;
            refresh) CAP=900 ;;
            closing) CAP=250 ;;
            *) CAP=0 ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "cap=$CAP" >> "$GITHUB_OUTPUT"
          echo "Mod: $MODE, plafon cereri: $CAP"

      - name: Descarcă baza de date (release betpredict-db)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .betpredict
          # 27.10.2026: o descărcare întreruptă (PROTOCOL_ERROR) a pornit pipeline-ul pe o bază goală, care apoi a
          # suprascris baza bună (istoricul biletelor și al piramidelor). De acum: dacă asset-ul există, se descarcă
          # cu reîncercări și se verifică; dacă tot nu merge, rularea SE OPREȘTE (nu se face niciodată bootstrap peste el).
          if gh release view betpredict-db >/dev/null 2>&1; then
            if gh release view betpredict-db --json assets -q '.assets[].name' | grep -qx 'data.db.gz'; then
              ok=0
              for i in 1 2 3 4 5; do
                rm -f .betpredict/data.db.gz .betpredict/data.db
                if gh release download betpredict-db -p data.db.gz -D .betpredict --clobber && gzip -t .betpredict/data.db.gz \
                   && gunzip -f .betpredict/data.db.gz \
                   && python -c "import sqlite3,sys; c=sqlite3.connect('.betpredict/data.db'); assert c.execute('PRAGMA quick_check').fetchone()[0]=='ok'"; then
                  ok=1; break
                fi
                echo "Descărcarea DB a eșuat (încercarea $i), reîncerc…"; sleep $((i * 10))
              done
              [ "$ok" = 1 ] || { echo "::error::Baza de date din release nu s-a putut descărca; opresc rularea ca să n-o suprascriu."; exit 1; }
              python -c "import sqlite3; c=sqlite3.connect('.betpredict/data.db'); print(c.execute('SELECT COUNT(*) FROM ticket').fetchone()[0])" > .betpredict/tickets_before.txt || echo 0 > .betpredict/tickets_before.txt
              echo "DB descărcată: $(du -h .betpredict/data.db | cut -f1), bilete: $(cat .betpredict/tickets_before.txt)"
            else
              echo "Release fără DB — bootstrap din istoric."
            fi
          else
            gh release create betpredict-db --title "BetPredict DB (automat)" \
              --notes "Asset-uri generate automat de pipeline-ul v3. Nu șterge." --latest=false
          fi

      - name: Rulează pipeline-ul
        id: run
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          GH_TOKEN: ${{ github.token }}  # doar citire: issue-urile „stefan” cu linkuri de bilete
        run: |
          ARGS="--out .betpredict/site_api --report .betpredict/report.json"
          [ "${{ steps.mode.outputs.cap }}" != "0" ] && ARGS="$ARGS --max-requests ${{ steps.mode.outputs.cap }}"
          [ "${{ github.event.inputs.rebuild_tickets }}" = "true" ] && ARGS="$ARGS --rebuild-tickets"
          python -m betpredict run ${{ steps.mode.outputs.mode }} $ARGS
          python -m betpredict quota || true
          # closing publică doar când a apărut o alertă nouă „Valoare în ultimele 3 ore”
          python -c "import json; r=json.load(open('.betpredict/report.json')); print('publish=' + ('1' if r.get('publish') else '0'))" >> "$GITHUB_OUTPUT" || true

      - name: Salvează DB + api/ în release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f .betpredict/data.db ] || exit 0
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect('.betpredict/data.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()
          PY
          # siguranță: nu urcăm o bază cu (mult) mai puține bilete decât cea descărcată
          before=$(cat .betpredict/tickets_before.txt 2>/dev/null || echo 0)
          after=$(python -c "import sqlite3; c=sqlite3.connect('.betpredict/data.db'); print(c.execute('SELECT COUNT(*) FROM ticket').fetchone()[0])" || echo 0)
          if [ "$before" -gt 100 ] && [ "$after" -lt $((before * 9 / 10)) ]; then
            echo "::error::Baza nouă are $after bilete față de $before descărcate — nu o urc."; exit 1
          fi
          gzip -kf .betpredict/data.db
          if [ -d .betpredict/site_api/api ]; then tar -czf .betpredict/site_api.tar.gz -C .betpredict/site_api api; fi
          # copie de rezervă a bazei anterioare (o zi întreagă de rulări în urmă nu se mai pierde dintr-o greșeală)
          if [ "$(date -u +%H)" = "03" ] || ! gh release view betpredict-db --json assets -q '.assets[].name' | grep -qx 'data-backup.db.gz'; then
            cp .betpredict/data.db.gz .betpredict/data-backup.db.gz && gh release upload betpredict-db .betpredict/data-backup.db.gz --clobber || true
          fi
          gh release upload betpredict-db .betpredict/data.db.gz --clobber
          [ -f .betpredict/site_api.tar.gz ] && gh release upload betpredict-db .betpredict/site_api.tar.gz --clobber || true

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: report-${{ steps.mode.outputs.mode }}
          path: .betpredict/report.json
          if-no-files-found: ignore
          retention-days: 1

      - uses: actions/setup-node@v5
        if: github.ref == 'refs/heads/main' && (steps.mode.outputs.mode != 'closing' || steps.run.outputs.publish == '1')
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        if: github.ref == 'refs/heads/main' && (steps.mode.outputs.mode != 'closing' || steps.run.outputs.publish == '1')
        working-directory: frontend
        run: |
          npm ci
          npm run build:site

      - name: Asamblează site-ul
        if: github.ref == 'refs/heads/main' && (steps.mode.outputs.mode != 'closing' || steps.run.outputs.publish == '1')
        run: |
          python -m betpredict site-assemble --dist frontend/dist --out _site --api .betpredict/site_api/api
          python -m betpredict scan-secrets _site/assets _site/api

      - name: Deploy pe gh-pages
        if: github.ref == 'refs/heads/main' && (steps.mode.outputs.mode != 'closing' || steps.run.outputs.publish == '1')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy site (pipeline v3)'

  # Pornește așteptarea până la 00:00, 06:00, 12:00 sau 18:00. Nu ține blocat pipeline-ul.
  arm-slot:
    needs: pipeline
    if: >
      github.ref == 'refs/heads/main' &&
      (needs.pipeline.result == 'success' || needs.pipeline.result == 'failure') &&
      github.event.schedule != '41 7-20 * * *' &&
      github.event.schedule != '29 15-19 * * *' &&
      github.event.schedule != '47 2 * * 1' &&
      github.event.inputs.mode != 'closing' &&
      github.event.inputs.mode != 'learn' &&
      github.event.inputs.mode != 'offline'
    runs-on: ubuntu-24.04   # fixat: ubuntu-latest trece pe Ubuntu 26 din 19.10.2026
    timeout-minutes: 5
    steps:
      - name: Armează următorul slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run betpredict_slot.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "→ aștept 00:00, 06:00, 12:00 sau 18:00, ora României"
# schedule re-register 2026-10-13T06:20Z chain
