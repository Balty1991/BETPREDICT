name: 🧹 Cleanup debug (manual)

# Curăță DOAR logurile de debug vechi ale pipeline-ului legacy (data/debug/*.json > 7 zile).
# Doar manual: nimic nu mai scrie în data/debug după trecerea la v3.
# Siguranță: datele v3 (DB-ul din release-ul `betpredict-db`, gh-pages, api/, data/warehouse)
# nu sunt atinse; commit-ul include exclusiv data/debug și pică dacă s-ar modifica altceva.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-debug
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Șterge data/debug/*.json mai vechi de 7 zile (după data din git)
        run: |
          set -euo pipefail
          [ -d data/debug ] || { echo "Nu există data/debug"; exit 0; }
          now=$(date +%s)
          for f in data/debug/*.json; do
            [ -f "$f" ] || continue
            ts=$(git log -1 --format=%ct -- "$f" || echo "$now")
            if [ $(( now - ${ts:-$now} )) -gt $(( 7 * 86400 )) ]; then git rm -q -- "$f"; fi
          done
          git status --short

      - name: Gardă — doar data/debug
        run: |
          set -euo pipefail
          bad=$(git diff --cached --name-only | grep -v '^data/debug/' || true)
          if [ -n "$bad" ]; then echo "::error::Cleanup ar modifica fișiere în afara data/debug:"; echo "$bad"; exit 1; fi

      - name: Commit
        run: |
          set -euo pipefail
          git diff --cached --quiet && { echo "Nimic de curățat"; exit 0; }
          git config user.email "betpredict-bot@github.com"
          git config user.name  "BetPredict Bot"
          git commit -m "🧹 cleanup data/debug $(date -u '+%Y-%m-%d')"
          git push
