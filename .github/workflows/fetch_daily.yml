name: 📊 Fetch Daily Data

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: betpredict-push
  cancel-in-progress: false

jobs:
  fetch-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v6-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-v6-

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch data
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          BETPREDICT_TEAM_LIMIT: "42"
          BETPREDICT_CONTEXT_INTEL_LIMIT: "24"
          BETPREDICT_PLAYER_TEAM_LIMIT: "24"
          BETPREDICT_PLAYER_LIMIT: "72"
          BETPREDICT_PLAYERS_PER_TEAM_LIMIT: "80"
          BETPREDICT_PLAYER_STATS_LIMIT: "120"
          BETPREDICT_PLAYER_TRANSFERS_LIMIT: "50"
          BETPREDICT_PLAYER_HTTP_SLEEP: "0.04"
          BETPREDICT_PLAYER_HTTP_TIMEOUT: "15"
          BETPREDICT_EVENT_DEEP_LIMIT: "48"
          BETPREDICT_EVENT_DEEP_HTTP_SLEEP: "0.04"
          BETPREDICT_EVENT_DEEP_HTTP_TIMEOUT: "18"
          BETPREDICT_EVENT_DEEP_ENABLE_SHOTMAP: "0"
        run: |
          python src/fetch_league_metadata.py
          python src/fetch_daily.py
          python src/fetch_event_deep_data.py
          python src/fetch_player_intelligence.py
          python src/league_strength_safety.py
          python src/context_engine_runner.py
          python src/player_impact_engine.py
          python src/lineup_intelligence.py
          python src/event_match_intelligence.py
          python src/context_entity_hardening.py
          python src/market_odds_audit.py
          python src/api_coverage_final.py
          python src/bsd_v2_exact.py
          python src/match_data_pack.py
          python src/inject_match_data_pack_ui.py

      # v6.0 ML Pipeline + Healthcheck
      - name: ML Pipeline v6
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: |
          echo "=== [1/6] ML Ensemble ==="
          python src/ml_ensemble.py || echo "[WARN] ml_ensemble.py esuat, continuam"
          echo "=== [2/6] Calibration Engine ==="
          python src/calibration_engine.py || echo "[WARN] calibration_engine.py esuat, continuam"
          echo "=== [3/6] Adaptive Thresholds ==="
          python src/adaptive_thresholds.py || echo "[WARN] adaptive_thresholds.py esuat, continuam"
          echo "=== [4/6] Consensus Engine ==="
          python src/consensus_engine.py || echo "[WARN] consensus_engine.py esuat, continuam"
          echo "=== [5/6] Compute Signals v6 (CHEIE — augmenteaza signals.json) ==="
          python src/compute_signals_v6.py || echo "[WARN] compute_signals_v6.py esuat, continuam"
          echo "=== [6/6] Healthcheck v6 (semafor pentru UI) ==="
          python src/v6_healthcheck.py || echo "[WARN] v6_healthcheck.py esuat, continuam"
          echo "=== [7/7] Backtest v5 vs v6 (istoric + ROI counterfactual) ==="
          python src/v6_backtest.py || echo "[WARN] v6_backtest.py esuat, continuam"
          echo "=== ML Pipeline v6 complet ==="

      - name: Commit & Push
        run: |
          git config --local user.email "betpredict-bot@github.com"
          git config --local user.name  "BetPredict Bot"
          git add data/ assets/ index.html \
            src/fetch_daily.py \
            src/fetch_league_metadata.py \
            src/fetch_event_deep_data.py \
            src/fetch_player_intelligence.py \
            src/player_impact_engine.py \
            src/lineup_intelligence.py \
            src/event_match_intelligence.py \
            src/context_entity_hardening.py \
            src/market_odds_audit.py \
            src/api_coverage_final.py \
            src/league_strength_safety.py \
            src/context_engine.py \
            src/context_engine_runner.py \
            src/ml_ensemble.py \
            src/calibration_engine.py \
            src/adaptive_thresholds.py \
            src/consensus_engine.py \
            src/compute_signals_v6.py \
            src/v6_healthcheck.py \
            src/v6_backtest.py \
            analytics_core.py \
            requirements.txt \
            tests/ \
            .github/workflows/fetch_daily.yml \
            .github/workflows/ml_train.yml \
            -f
          if [ -d "models" ]; then
            git add models/ -f || true
          fi
          git diff --quiet && git diff --staged --quiet && exit 0

          # Extrage status v6 pentru commit message
          V6_STATUS=$(python3 -c "
          import json
          try:
              with open('data/v6_health.json') as f:
                  d = json.load(f)
              s = d['overall']['status']
              emoji = {'GREEN':'🟢','YELLOW':'🟡','RED':'🔴'}.get(s,'?')
              print(f'{emoji}{s}')
          except Exception:
              print('?')
          " 2>/dev/null || echo "?")

          git commit -m "🤖 ML v6 $(TZ=Europe/Bucharest date '+%d.%m %H:%M') · $V6_STATUS"
          git fetch origin main
          git rebase origin/main
          git push
