name: 📊 Fetch Daily Data

on:
  schedule:
    - cron: '0 2 * * *'   # 06:00 Dubai
    - cron: '0 10 * * *'  # 14:00 Dubai (al doilea fetch zilnic)
  workflow_dispatch:

concurrency:
  group: fetch-betpredict
  cancel-in-progress: false

jobs:
  fetch-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch all data
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: python src/fetch_daily.py

      - name: Commit & Push
        run: |
          git config --local user.email "betpredict-bot@github.com"
          git config --local user.name  "BetPredict Bot"
          git add data/ -f
          git diff --quiet && git diff --staged --quiet \
            || (git commit -m "📊 $(TZ=Europe/Bucharest date '+%d.%m %H:%M')" && git push)
