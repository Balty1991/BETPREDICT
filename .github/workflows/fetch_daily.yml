name: 📊 Fetch Daily Data

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: betpredict-push
  cancel-in-progress: false

jobs:
  fetch-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Cache pip — evita reinstalarea CatBoost/LightGBM la fiecare run (~3 min saved)
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v6-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-v6-

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch data
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}

          # Coverage Upgrade v3 — mărește acoperirea Player/Team Impact fără API nou.
          # 42 echipe înseamnă aproximativ 126 request-uri team detail/squad/fixtures.
          # Player Intelligence rămâne limitat controlat, ca să nu blocheze workflow-ul.
          BETPREDICT_TEAM_LIMIT: "42"
          BETPREDICT_CONTEXT_INTEL_LIMIT: "24"
          BETPREDICT_PLAYER_TEAM_LIMIT: "24"
          BETPREDICT_PLAYER_LIMIT: "72"
          BETPREDICT_PLAYERS_PER_TEAM_LIMIT: "80"
          BETPREDICT_PLAYER_STATS_LIMIT: "120"
          BETPREDICT_PLAYER_TRANSFERS_LIMIT: "50"
          BETPREDICT_PLAYER_HTTP_SLEEP: "0.04"
          BETPREDICT_PLAYER_HTTP_TIMEOUT: "15"

          # Event Deep Data v2 — stats/lineups/player-stats/incidents + combined compact.
          # Shotmap rămâne oprit implicit fiindcă v1 a returnat 404 pe toate evenimentele.
          BETPREDICT_EVENT_DEEP_LIMIT: "48"
          BETPREDICT_EVENT_DEEP_HTTP_SLEEP: "0.04"
          BETPREDICT_EVENT_DEEP_HTTP_TIMEOUT: "18"
          BETPREDICT_EVENT_DEEP_ENABLE_SHOTMAP: "0"
        run: |
          python src/fetch_league_metadata.py
          python src/fetch_daily.py
          python src/fetch_event_deep_data.py
          python src/fetch_player_intelligence.py
          python src/league_strength_safety.py
          python src/context_engine_runner.py
          python src/player_impact_engine.py
          python src/lineup_intelligence.py
          python src/event_match_intelligence.py
          python src/context_entity_hardening.py
          python src/market_odds_audit.py
          python src/api_coverage_final.py
          python src/bsd_v2_exact.py
          python src/match_data_pack.py
          python src/inject_match_data_pack_ui.py

      # v6.0 ML Pipeline — rulat DUPA fetch_daily (are nevoie de predictions.json + signals.json)
      # Fiecare script este independent: daca unul esueaza, urmatorul continua
      # Ordinea conteaza: ml_ensemble -> calibration -> adaptive -> consensus -> compute_signals
      - name: ML Pipeline v6
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: |
          echo "=== [1/5] ML Ensemble ==="
          python src/ml_ensemble.py || echo "[WARN] ml_ensemble.py a esuat, continuam"
          echo "=== [2/5] Calibration Engine ==="
          python src/calibration_engine.py || echo "[WARN] calibration_engine.py a esuat, continuam"
          echo "=== [3/5] Adaptive Thresholds ==="
          python src/adaptive_thresholds.py || echo "[WARN] adaptive_thresholds.py a esuat, continuam"
          echo "=== [4/5] Consensus Engine ==="
          python src/consensus_engine.py || echo "[WARN] consensus_engine.py a esuat, continuam"
          echo "=== [5/5] Compute Signals v6 (CHEIE — augmenteaza signals.json) ==="
          python src/compute_signals_v6.py || echo "[WARN] compute_signals_v6.py a esuat, continuam"
          echo "=== ML Pipeline v6 complet ==="

      - name: Commit & Push
        run: |
          git config --local user.email "betpredict-bot@github.com"
          git config --local user.name  "BetPredict Bot"
          git add data/ assets/ index.html \
            src/fetch_daily.py \
            src/fetch_league_metadata.py \
            src/fetch_event_deep_data.py \
            src/fetch_player_intelligence.py \
            src/player_impact_engine.py \
            src/lineup_intelligence.py \
            src/event_match_intelligence.py \
            src/context_entity_hardening.py \
            src/market_odds_audit.py \
            src/api_coverage_final.py \
            src/league_strength_safety.py \
            src/context_engine.py \
            src/context_engine_runner.py \
            src/ml_ensemble.py \
            src/calibration_engine.py \
            src/adaptive_thresholds.py \
            src/consensus_engine.py \
            src/compute_signals_v6.py \
            analytics_core.py \
            requirements.txt \
            .github/workflows/fetch_daily.yml \
            -f
          # Adauga models/ daca exista (modele ML antrenate)
          if [ -d "models" ]; then
            git add models/ -f || true
          fi
          # Daca nu sunt modificari, iesim
          git diff --quiet && git diff --staged --quiet && exit 0
          # COMMIT INAINTE de rebase (working tree trebuie sa fie curat)
          git commit -m "🤖 ML v6 $(TZ=Europe/Bucharest date '+%d.%m %H:%M')"
          # Rebase pe remote (daca fetch_live a push-uit intre timp)
          git fetch origin main
          git rebase origin/main
          git push
