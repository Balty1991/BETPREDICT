name: 📊 Fetch Daily Data

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: betpredict-push
  cancel-in-progress: false

jobs:
  fetch-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch data
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: |
          python src/fetch_league_metadata.py
          python src/fetch_daily.py
          python src/league_strength_safety.py
          python src/context_engine_runner.py
          python src/bsd_v2_exact.py
          python src/match_data_pack.py
          python src/inject_match_data_pack_ui.py

      - name: Commit & Push
        run: |
          git config --local user.email "betpredict-bot@github.com"
          git config --local user.name  "BetPredict Bot"
          git add data/ assets/ index.html src/fetch_daily.py src/fetch_league_metadata.py src/league_strength_safety.py src/context_engine.py src/context_engine_runner.py .github/workflows/fetch_daily.yml -f
          # Dacă nu sunt modificări, ieșim
          git diff --quiet && git diff --staged --quiet && exit 0
          # COMMIT ÎNAINTE de rebase (working tree trebuie să fie curat)
          git commit -m "📊 $(TZ=Europe/Bucharest date '+%d.%m %H:%M')"
          # Acum rebase pe remote (dacă fetch_live a push-uit între timp)
          git fetch origin main
          git rebase origin/main
          git push
