name: 📊 Fetch Daily Data

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  fetch-daily:
    name: Fetch predictions, matches, odds & standings
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: ⬇ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📊 Run fetch_daily.py
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: python src/fetch_daily.py

      - name: 💾 Commit & Push data
        run: |
          git config --local user.email "betpredict-bot@github.com"
          git config --local user.name  "BetPredict Bot"
          git add data/
          git diff --quiet && git diff --staged --quiet \
            || (git commit -m "📊 Update daily data — $(TZ=Europe/Bucharest date '+%d.%m.%Y %H:%M')" \
                && git push)
