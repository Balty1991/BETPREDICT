name: 🧹 Curăță artefactele vechi

# Spațiul Actions gratuit e 0.5 GB pe lună (artefacte). Ștergem zilnic artefactele mai vechi de o zi;
# biletele, baza de date și APK-ul stabil sunt în release-uri (nu se numără aici).
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Șterge artefactele mai vechi de o zi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          # întâi lista completă, apoi ștergerea (ștersul în timpul paginării sare peste artefacte)
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" -q ".artifacts[] | select(.created_at < \"$cutoff\") | .id" > ids.txt
          n=0
          while read -r id; do gh api -X DELETE "repos/$REPO/actions/artifacts/$id" && n=$((n+1)); done < ids.txt
          echo "Șterse: $n artefacte"
