name: 🐕 BetPredict watchdog (fallback cron)

# Dacă un slot (00, 06, 12, 18 ora României) a fost sărit, pornește un refresh.
# Nu mai publică din oră în oră: biletele rămân aceleași între sloturi.
on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

concurrency:
  group: betpredict-watchdog
  cancel-in-progress: true

permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-24.04   # fixat: ubuntu-latest trece pe Ubuntu 26 din 19.10.2026
    timeout-minutes: 5
    steps:
      - name: Verifică slotul ratat
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gen=$(curl -fsSL --max-time 20 "https://balty1991.github.io/BETPREDICT/api/meta.json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("generated_at") or "")' || true)
          age=9999
          if [ -n "$gen" ]; then
            age=$(( ( $(date -u +%s) - $(date -u -d "$gen" +%s) ) / 60 ))
          fi
          hour=$(TZ=Europe/Bucharest date +%H)
          minute=$(TZ=Europe/Bucharest date +%M)
          busy=$(gh run list -R "$REPO" -w betpredict_v3.yml -L 5 --json status -q '[.[]|select(.status!="completed")]|length')
          echo "Site: ${gen:-lipsește} (${age} min), ora RO ${hour}:${minute}, rulări active: $busy"
          missed=0
          case "$hour" in
            00|06|12|18) [ "$minute" -ge 20 ] && [ "$age" -ge 45 ] && missed=1 ;;
          esac
          [ "$age" -ge 480 ] && missed=1
          if [ "$missed" != "1" ] || [ "$busy" -ne 0 ]; then
            exit 0
          fi
          mode=refresh
          [ "$hour" = "06" ] && mode=daily
          gh workflow run betpredict_v3.yml -R "$REPO" --ref main -f mode="$mode"
          echo "→ $mode pornit, slot ratat"
