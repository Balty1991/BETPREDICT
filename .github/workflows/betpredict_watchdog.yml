name: 🐕 BetPredict watchdog (fallback cron)

# Cron-urile GitHub sunt „best effort” și uneori sunt sărite.
# La fiecare 15 minute, toată ziua, se uită la ora publicată în site.
# Dacă datele au peste 62 min și nu rulează deja un pipeline, pornește un refresh.
on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

concurrency:
  group: betpredict-watchdog
  cancel-in-progress: true

permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verifică ultima rulare și declanșează refresh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gen=$(curl -fsSL --max-time 20 "https://balty1991.github.io/BETPREDICT/api/meta.json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("generated_at") or "")' || true)
          age=9999
          if [ -n "$gen" ]; then
            age=$(( ( $(date -u +%s) - $(date -u -d "$gen" +%s) ) / 60 ))
          fi
          busy=$(gh run list -R "$REPO" -w betpredict_v3.yml -L 5 --json status -q '[.[]|select(.status!="completed")]|length')
          echo "Site public: ${gen:-lipsește} (acum $age min), rulări active/în coadă: $busy"
          if [ "$age" -le 62 ] || [ "$busy" -ne 0 ]; then
            exit 0
          fi
          for i in 1 2 3; do
            if gh workflow run betpredict_v3.yml -R "$REPO" --ref main -f mode=refresh; then
              echo "→ refresh declanșat"
              exit 0
            fi
            echo "dispatch eșuat ($i), reîncerc"
            sleep 25
          done
          exit 1
# schedule re-register 2026-10-13T05:05Z all day
