<!doctype html>
<html lang="ro" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="BETPREDICT 3.0 — predicții fotbal, bilete Robot, Piramida 2.00 și statistici." />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>BETPREDICT 3.0</title>
  </head>
  <body>
    <div id="bp-splash" aria-hidden="true">
      <style>
        #bp-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(600px 400px at 50% 40%,#0b2a2a 0%,#05070f 70%);transition:opacity .45s ease,visibility .45s}
        #bp-splash.out{opacity:0;visibility:hidden}
        #bp-splash .ring{width:96px;height:96px;border-radius:28px;display:grid;place-items:center;font:900 34px/1 Inter,system-ui,sans-serif;color:#03130f;background:linear-gradient(135deg,#08f0c8,#2bc4ff);box-shadow:0 0 60px rgba(8,240,200,.45);animation:bpPulse 1.4s ease-in-out infinite}
        #bp-splash .bar{margin-top:22px;width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
        #bp-splash .bar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,#08f0c8,#2bc4ff);animation:bpLoad 1s ease-in-out infinite}
        #bp-splash .wrap{display:flex;flex-direction:column;align-items:center}
        #bp-splash .t{margin-top:16px;font:800 15px Inter,system-ui,sans-serif;letter-spacing:.24em;color:#e6fffa}
        @keyframes bpPulse{50%{transform:scale(1.06);box-shadow:0 0 90px rgba(8,240,200,.6)}}
        @keyframes bpLoad{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
        @media (prefers-reduced-motion:reduce){#bp-splash .ring,#bp-splash .bar i{animation:none}}
      </style>
      <div class="wrap"><div class="ring">BP</div><div class="t">BETPREDICT</div><div class="bar"><i></i></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
