<!doctype html>
<html lang="ro" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c140e" />
    <meta name="description" content="BetPredict — bilete de cornere și piramida de cotă 2, jumătate din bancă." />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>BETPREDICT 3.0</title>
  </head>
  <body>
    <script>try{if(sessionStorage.getItem('bp-splash')||matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('no-splash');sessionStorage.setItem('bp-splash','1')}catch(e){}</script>
    <div id="bp-splash" aria-hidden="true">
      <style>
        .no-splash #bp-splash{display:none}
        #bp-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#1c140e;transition:opacity .28s ease,visibility .28s;pointer-events:none}
        #bp-splash.out{opacity:0;visibility:hidden}
        #bp-splash .wrap{display:flex;flex-direction:column;align-items:center}
        #bp-splash .logo{position:relative;width:96px;height:96px;animation:bpIn .45s cubic-bezier(.2,.8,.2,1) both}
        #bp-splash .logo::before{display:none}
        #bp-splash .ring{position:relative;width:96px;height:96px;border-radius:0;display:grid;place-items:center;font:700 32px/1 Georgia,Palatino,serif;color:#1c140e;background:#f3ead7;box-shadow:none;border:0}
        #bp-splash .t{margin-top:16px;font:700 13px/1.2 Georgia,Palatino,serif;letter-spacing:.22em;color:#f3ead7}
        @keyframes bpIn{from{transform:scale(.6)}to{transform:none}}
        @keyframes bpGlow{40%{opacity:1;transform:scale(1.1)}to{opacity:0;transform:scale(1.3)}}
        @keyframes bpPulse{50%{transform:scale(1.06);box-shadow:0 0 80px rgba(8,240,200,.7)}}
        @keyframes bpTxt{from{letter-spacing:.5em}}
      </style>
      <div class="wrap"><div class="logo"><div class="ring">BP</div></div><div class="t">BETPREDICT</div></div>
    </div>
    <script>setTimeout(function(){var e=document.getElementById('bp-splash');if(e){e.classList.add('out');setTimeout(function(){e.remove()},300)}},1100)</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
