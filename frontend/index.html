<!doctype html>
<html lang="ro" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="BETPREDICT 3.0 — predicții fotbal, bilete Robot, Piramida 2.00 și statistici." />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>BETPREDICT 3.0</title>
  </head>
  <body>
    <script>try{if(sessionStorage.getItem('bp-splash')||matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('no-splash');sessionStorage.setItem('bp-splash','1')}catch(e){}</script>
    <div id="bp-splash" aria-hidden="true">
      <style>
        .no-splash #bp-splash{display:none}
        #bp-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(600px 400px at 50% 40%,#0b2a2a 0%,#05070f 70%);transition:opacity .28s ease,visibility .28s;pointer-events:none}
        #bp-splash.out{opacity:0;visibility:hidden}
        #bp-splash .wrap{display:flex;flex-direction:column;align-items:center}
        #bp-splash .logo{position:relative;width:96px;height:96px;animation:bpIn .5s cubic-bezier(.2,.9,.25,1.2) both}
        #bp-splash .logo::before{content:'';position:absolute;inset:-18px;border-radius:40px;background:radial-gradient(closest-side,rgba(8,240,200,.55),transparent);opacity:0;animation:bpGlow .9s ease-out .15s both}
        #bp-splash .ring{position:relative;width:96px;height:96px;border-radius:28px;display:grid;place-items:center;font:900 34px/1 Inter,system-ui,sans-serif;color:#03130f;background:linear-gradient(135deg,#08f0c8,#2bc4ff);box-shadow:0 0 50px rgba(8,240,200,.45);animation:bpPulse .9s ease-in-out .35s both}
        #bp-splash .t{margin-top:16px;font:800 15px Inter,system-ui,sans-serif;letter-spacing:.24em;color:#e6fffa;animation:bpTxt .45s ease-out .2s both}
        @keyframes bpIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
        @keyframes bpGlow{40%{opacity:1;transform:scale(1.1)}to{opacity:0;transform:scale(1.3)}}
        @keyframes bpPulse{50%{transform:scale(1.06);box-shadow:0 0 80px rgba(8,240,200,.7)}}
        @keyframes bpTxt{from{opacity:0;letter-spacing:.5em}to{opacity:1}}
      </style>
      <div class="wrap"><div class="logo"><div class="ring">BP</div></div><div class="t">BETPREDICT</div></div>
    </div>
    <script>setTimeout(function(){var e=document.getElementById('bp-splash');if(e){e.classList.add('out');setTimeout(function(){e.remove()},300)}},1100)</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
